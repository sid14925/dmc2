<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>Devil May Cry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #game-canvas {
      display: block;
      width: 100%; height: 100%;
      position: fixed; top: 0; left: 0;
    }
    #ui-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #ui-overlay > * { pointer-events: auto; }
    #loading-screen {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    #loading-screen h1 {
      font-size: 48px; color: #cc0000;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #880000;
      font-style: italic; letter-spacing: 4px;
      margin-bottom: 20px;
    }
    #loading-screen .subtitle {
      font-size: 16px; color: #666;
      letter-spacing: 8px; text-transform: uppercase;
    }
    #loading-bar-container {
      width: 300px; height: 4px;
      background: #222; margin-top: 30px;
      border-radius: 2px; overflow: hidden;
    }
    #loading-bar {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #cc0000, #ff4444);
      transition: width 0.3s;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DUVbk9rn.js"></script>
</head>
<body>
  <div id="loading-screen">
    <h1>DEVIL MAY CRY</h1>
    <div class="subtitle">Loading</div>
    <div id="loading-bar-container">
      <div id="loading-bar"></div>
    </div>
  </div>
  <canvas id="game-canvas"></canvas>
  <div id="ui-overlay"></div>
</body>
</html>
